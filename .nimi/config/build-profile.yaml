build_profile_ref: electron-pnpm
profile_role: developer-workflow-input
test_command: pnpm run test:app
build_command: pnpm run build:electron:production
targets:
  windows-x86_64:
    build_command: pnpm run build:electron:production
    os: windows
    arch: x86_64
    payload_path: dist-electron-package/presenton-shell-win32-x64
    runtime_entry: payload/presenton-shell.exe
  macos-aarch64:
    build_command: pnpm run build:electron:macos
    os: macos
    arch: arm64
    payload_path: dist-electron-package/presenton-shell-darwin-arm64
    runtime_entry: payload/presenton-shell.app/Contents/MacOS/presenton-shell
