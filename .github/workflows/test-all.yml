name: Test Presenton

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fastapi:
    name: Python business and Nimi carrier tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock
          python-version: '3.11'
      - run: uv sync --locked --dev
        working-directory: servers/fastapi
      - run: uv run --locked pytest -q
        working-directory: servers/fastapi

  test-app:
    name: Host, renderer and repository tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nimi-app check
      - run: pnpm run typecheck
      - run: pnpm run test:repository
      - run: pnpm --dir servers/nextjs test
      - run: pnpm --dir servers/nextjs run lint
      - run: pnpm --dir servers/nextjs exec cypress install
      - run: pnpm --dir servers/nextjs exec cypress run --component --browser electron
